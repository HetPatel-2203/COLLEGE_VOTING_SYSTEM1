<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/config.js"></script>
<title>Events</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="main">

<div class="topbar">
<h1>College Events</h1>
</div>

<div id="events" class="cards"></div>

</div>

<script>

async function loadEvents(){

try{

let r = await fetch(
API_URL + "/events"
);

if(!r.ok){

throw new Error("Server Error");

}

let data = await r.json();

let html = "";

if(data.length === 0){

html = `

<div class="card">

<h2>No Events Available</h2>

<p>Admin has not added any events yet.</p>

</div>

`;

document.getElementById("events").innerHTML = html;

return;

}

data.forEach(x=>{

html += `

<div class="card">

<img
src="${x.poster || 'https://via.placeholder.com/300x200?text=No+Image'}"

style="
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
"

onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">

<h2>${x.eventName || "No Event"}</h2>

<p>
<b>Department:</b>
${x.department || "N/A"}
</p>

<p>
<b>Date:</b>
${x.date || "N/A"}
</p>

<a href="vote.html?id=${x._id}">
<button>
Vote Now
</button>
</a>

</div>

`;

});

document.getElementById("events").innerHTML = html;

}
catch(err){

console.log(err);

document.getElementById("events").innerHTML = `

<div class="card">

<h2>Error Loading Events</h2>

<p>Please check if backend server is running.</p>

</div>

`;

}

}

loadEvents();

</script>

</body>
</html>
