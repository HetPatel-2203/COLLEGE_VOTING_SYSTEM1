<!DOCTYPE html>

<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/config.js"></script>

<link rel="stylesheet"

href="css/dashboard.css">

</head>

<body>

<div class="main">

<h1>

Department Results

</h1>

<div

id="r"

class="cards">

</div>

</div>

<script>

fetch(

API_URL + "/departments"

)

.then(x=>x.json())

.then(d=>{

let h="";

d.forEach(x=>{

h+=`

<div class="card">

<h2>

${x.name}

</h2>

<p>

Votes:

${x.totalVotes}

/

${x.totalStudents}

</p>

</div>

`;

});

r.innerHTML=h;

});

</script>

</body>

</html>
