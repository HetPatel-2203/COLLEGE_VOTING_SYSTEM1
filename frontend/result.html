<!DOCTYPE html>

<html>

<head>

<link rel="stylesheet"

href="css/dashboard.css">

</head>

<body>

<div class="main">

<h1>

Department Results

</h1>

<div

id="r"

class="cards">

</div>

</div>

<script>

fetch(

"http://localhost:5001/departments"

)

.then(x=>x.json())

.then(d=>{

let h="";

d.forEach(x=>{

h+=`

<div class="card">

<h2>

${x.name}

</h2>

<p>

Votes:

${x.totalVotes}

/

${x.totalStudents}

</p>

</div>

`;

});

r.innerHTML=h;

});

</script>

</body>

</html>
