<!DOCTYPE html>
<html>

<head>

<title>

Student Queries

</title>

<link rel="stylesheet"

href="css/dashboard.css">

</head>

<body>

<div class="main">

<div class="topbar">

<h1>

Student Queries

</h1>

</div>

<div

id="queries"

class="cards"

>

</div>

</div>

<script>

async function load(){

let r=

await fetch(

"http://localhost:5001/queries"

);

let data=

await r.json();

let html="";

data.forEach(x=>{

html+=`

<div class="card">

<h2>

Department:

${x.department}

</h2>

<p>

Vote:

${x.candidate}

</p>

<p>

Message:

${x.query}

</p>

</div>

`;

});

queries.innerHTML=

html;

}

load();

</script>

</body>

</html>
