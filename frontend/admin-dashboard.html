Admin Dashboard

</title>

<link rel="stylesheet"

href="css/dashboard.css">

<style>

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));

gap:20px;

margin-top:20px;

}

.card{

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 5px 15px rgba(0,0,0,0.1);

text-align:center;

}

.card img{

width:100%;

height:200px;

object-fit:cover;

border-radius:15px;

margin-bottom:15px;

}

.card button{

background:#2563eb;

color:white;

border:none;

padding:10px 20px;

border-radius:10px;

cursor:pointer;

margin-top:10px;

}

.card button:hover{

background:#1d4ed8;

}

form{

display:flex;

flex-direction:column;

gap:15px;

}

form input,

form select{

padding:15px;

border-radius:10px;

border:1px solid #ccc;

font-size:16px;

}

form button{

padding:15px;

border:none;

background:#2563eb;

color:white;

font-size:18px;

border-radius:10px;

cursor:pointer;

}

form button:hover{

background:#1d4ed8;

}

</style>

</head>

<div class="main">

<div class="topbar">

<h1>

Create Event

</h1>

</div>



<div class="card">

<form id="eventForm">

<input

type="text"

id="eventName"

placeholder="Event Name"

required

>




<select

id="department"

required

>

<option>

Loading...

</option>

</select>







<input

type="date"

id="date"

required

>



<input

type="file"

id="poster"

accept="image/*"

required

>



<button type="submit">

Add Event

</button>

</form>

</div>



<br>



<h2>

Manage Events

</h2>



<div

id="eventBox"

class="cards"

>

</div>

</div>



<script>

/* Load Departments */

async function loadDepartments(){

try{

let r=

await fetch(

API_URL + "/departments"

);

let data=

await r.json();

let department=

document.getElementById(

"department"

);

department.innerHTML="";



if(data.length===0){

department.innerHTML=

`<option>No Department</option>`;

return;

}



data.forEach(d=>{

department.innerHTML += `

<option value="${d.name}">

${d.name}

</option>

`;

});

}

catch(err){

console.log(err);

alert("Department Load Error");

}

}



/* Add Event */

document.getElementById(

"eventForm"

).addEventListener(

"submit",

async(e)=>{

e.preventDefault();

let eventName =
document.getElementById("eventName").value.trim();

if(eventName.length < 3){

alert("Event Name must be at least 3 characters");

return;

}

try{

let form=

new FormData();



form.append(

"eventName",

document.getElementById(

"eventName"

).value

);


form.append(

"department",

document.getElementById(

"department"

).value

);



form.append(

"date",

document.getElementById(

"date"

).value

);



let file=

document.getElementById(

"poster"

).files[0];



if(file){

form.append(

"poster",

file

);

}



let r=

await fetch(

API_URL + "/event",

{

method:"POST",

body:form

}

);



let d=

await r.json();

alert(d.msg);



document.getElementById(

"eventForm"

).reset();



loadEvents();

}

catch(err){

console.log(err);

alert("Event Add Error");

}

});



/* Load Events */

async function loadEvents(){

try{

let r=

await fetch(

API_URL + "/events"

);

let data=

await r.json();



let html="";



data.reverse().forEach(x=>{



let image=

x.poster

?

x.poster

:

"https://via.placeholder.com/300x200?text=No+Image";



html += `

<div class="card">

<img

src="${image}"

onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'"

>



<h2>

${x.eventName || "No Event"}

</h2>



<p>

<b>Department:</b>

${x.department || "N/A"}

</p>



<p>

<b>Date:</b>

${x.date || "N/A"}

</p>


<button
onclick="editEvent('${x._id}')"
>
Edit
</button>

<button
onclick="deleteEvent('${x._id}')"
>
Delete
</button>

</div>

`;

});



document.getElementById(

"eventBox"

).innerHTML=html;

}

catch(err){

console.log(err);

alert("Load Event Error");

}

}



/* Delete Event */

async function deleteEvent(id){

try{

await fetch(

API_URL + "/event/"+id,

{

method:"DELETE"

}

);



alert("Event Deleted");



loadEvents();

}

catch(err){

console.log(err);

alert("Delete Error");

}

}

/* Edit Event */
async function editEvent(id){

let eventName = prompt("Enter New Event Name");
if(!eventName) return;

let department = prompt("Enter New Department");
if(!department) return;

let date = prompt("Enter New Date (YYYY-MM-DD)");
if(!date) return;

let r = await fetch(
API_URL + "/event/" + id,
{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
eventName:eventName,
department:department,
date:date
})
}
);

let d = await r.json();

alert(d.msg);

loadEvents();

}




/* Start */

loadDepartments();

loadEvents();

</script>

<script>
function adminLogout(){

localStorage.removeItem("admin");

window.location = "admin-login.html";


}
</script>
