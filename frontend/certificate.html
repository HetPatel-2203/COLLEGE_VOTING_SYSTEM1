<!DOCTYPE html>
<html>

<head>

<title>Certificate</title>

<link rel="stylesheet" href="css/dashboard.css">

<style>

.certificate{

background:white;

padding:40px;

border:8px solid #2563eb;

border-radius:20px;

text-align:center;

max-width:800px;

margin:auto;

margin-top:20px;

}

.certificate h1{

font-size:40px;

color:#2563eb;

}

.certificate p{

font-size:20px;

margin:15px 0;

}

.downloadBtn{

background:#2563eb;

color:white;

border:none;

padding:15px 30px;

font-size:18px;

border-radius:10px;

cursor:pointer;

margin-top:20px;

}

</style>

</head>

<body>

<div class="main">

<h1>📜 Certificates</h1>

<div id="certificate" class="certificate">

<h1>Certificate of Participation</h1>

<p>This Certificate is Proudly Presented To</p>

<h2 id="studentName"></h2>

<p id="studentRoll"></p>

<p id="studentDepartment"></p>

<p>
For Active Participation in College Event
</p>

<p id="todayDate"></p>

</div>

<center>

<button
class="downloadBtn"
onclick="downloadCertificate()"
>

Download PDF

</button>

</center>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

/* Login Check */

const user =
JSON.parse(
localStorage.getItem("user")
);

if(!user){

alert("Please Login First");

window.location =
"login.html";

}

/* Student Details */

document.getElementById("studentName").innerHTML =
user.name || "Student Name";

document.getElementById("studentRoll").innerHTML =
"Roll No : " +
(user.rollno || "Not Available");

document.getElementById("studentDepartment").innerHTML =
"Department : " +
(user.department || "Not Available");

document.getElementById("todayDate").innerHTML =
"Date : " +
new Date().toLocaleDateString();

/* Download Certificate */

function downloadCertificate(){

const element =
document.getElementById("certificate");

const opt = {

margin:1,

filename:
(user.name || "Student") +
"_Certificate.pdf",

image:{
type:'jpeg',
quality:1
},

html2canvas:{
scale:2
},

jsPDF:{
unit:'in',
format:'letter',
orientation:'landscape'
}

};

html2pdf()
.set(opt)
.from(element)
.save();

}

</script>


</body>

</html>
