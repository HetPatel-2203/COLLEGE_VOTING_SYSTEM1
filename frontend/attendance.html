<!DOCTYPE html>

<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/config.js"></script>

<title>

Attendance

</title>

<link rel="stylesheet"

href="css/dashboard.css">

</head>

<body>

<div class="main">

<div class="topbar">

<h1>

Student Attendance

</h1>

</div>

<div class="card"

style="max-width:500px;margin:auto;text-align:center;">

<h2 id="studentName">

</h2>

<p id="rollno">

</p>

<p id="department">

</p>

<button id="attendanceBtn">

Mark Attendance

</button>

</div>

</div>


<script>

const user =
JSON.parse(
localStorage.getItem("user")
);

/* Login Check */

if(!user){

alert("Please Login First");

window.location =
"login.html";

}

/* Show Student Details */

document.getElementById(
"studentName"
).innerText =
user.name || "N/A";

document.getElementById(
"rollno"
).innerText =
"Roll No: " +
(user.rollno || "N/A");

document.getElementById(
"department"
).innerText =
"Department: " +
(user.department || "N/A");

/* Attendance */

document.getElementById(
"attendanceBtn"
).addEventListener(
"click",

async()=>{

try{

if(!user._id){

alert("User Data Missing");

return;

}

let r = await fetch(

API_URL + "/attendance",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

studentId:user._id,

rollno:user.rollno,

name:user.name,

department:user.department,

eventName:"College Event"

})

}

);

let d =
await r.json();

alert(
d.msg || "Attendance Submitted"
);

}
catch(err){

console.log(err);

alert(
"Attendance Server Error"
);

}

}

);

</script>

</body>

</html>
