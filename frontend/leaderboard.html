<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/config.js"></script>

<title>

Leaderboard

</title>

<link rel="stylesheet"

href="css/dashboard.css">

</head>

<body>

<div class="main">

<div class="topbar">

<h1>

Department Leaderboard

</h1>

</div>

<div

id="board"

class="cards"

>

</div>

</div>


<script>

async function loadBoard(){

let r=

await fetch(

API_URL + "/departments"

);

let data=

await r.json();

data.sort(

(a,b)=>

b.totalVotes-

a.totalVotes

);

let html="";

data.forEach((x,i)=>{

let per=0;

if(

x.totalStudents>0

){

per=

(

x.totalVotes

/

x.totalStudents

*100

).toFixed(1);

}

html+=`

<div class="card">

<h2>

#${i+1}

${x.name}

</h2>

<p>

Votes:

${x.totalVotes}

/

${x.totalStudents}

</p>

<p>

Participation:

${per}%

</p>

</div>

`;

});

board.innerHTML=

html;

}

loadBoard();

</script>

</body>

</html>
